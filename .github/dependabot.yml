version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  # cborg stays pinned EXACTLY in package.json so a given release of this
  # verifier is byte-reproducible, but its updates are no longer ignored. The
  # freeze was justified by "the deterministic encoder must not drift", and
  # src/__tests__/encoder-version-invariance.test.ts now proves the stronger
  # claim: the only thing this package encodes is a Sig_structure of one text
  # string and three byte strings, which no cborg version has ever encoded
  # differently. That test is the gate. Let dependabot propose, let CI decide.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # @types/node tracks the LTS runtime we ship to, not the newest Node. This
      # package declares engines.node >=24, and typing against a newer
      # @types/node lets tsc accept APIs that do not exist on the runtime
      # customers actually run. Node 24 (Krypton) is the current Active LTS;
      # Node 26 goes LTS on 2026-10-28. Take the @types/node major once its
      # matching Node line is LTS, not while it is still Current.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
