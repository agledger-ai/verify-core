version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  # cborg is pinned exactly in package.json so each release is
  # byte-reproducible. src/__tests__/encoder-version-invariance.test.ts gates
  # every proposed bump.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # @types/node tracks the LTS runtime we ship to, not the newest Node. This
      # package declares engines.node >=24, and typing against a newer
      # @types/node lets tsc accept APIs that do not exist on the runtime
      # customers actually run. Raise it together with the engines floor.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
